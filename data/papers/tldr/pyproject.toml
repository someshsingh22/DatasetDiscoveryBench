[project]
name = "tldr-env"
version = "0.1.0"
requires-python = "==3.11.8"  # tyro 0.6.0 breaks on the argparse of Python 3.11.9+
dependencies = [  # the re-implementation's poetry.lock versions; ftfy is OpenAI's (Pipfile.lock)
    "accelerate==0.25.0",
    "datasets==2.12.0",
    "deepspeed==0.12.6",
    "fsspec==2023.6.0",  # newer fsspec breaks hub loading in datasets 2.12
    "ftfy==5.8",
    "huggingface-hub==0.19.4",
    "nltk==3.8.1",  # rouge-score's stemmer
    "numpy==1.26.3",
    "pandas==2.0.2",
    "pyarrow==12.0.0",  # pyarrow 21+ breaks datasets 2.12
    "pydantic==2.5.2",  # deepspeed
    "rich==13.4.2",
    "rouge-score==0.1.2",
    "tensorboard==2.13.0",
    "torch==2.1.2",
    "transformers==4.33.2",
    "tyro==0.6.0",
]

[tool.ruff]
line-length = 120
