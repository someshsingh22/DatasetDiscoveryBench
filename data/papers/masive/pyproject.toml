[project]
name = "masive-env"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=0.26",
    "datasets>=2.19",
    "pandas>=2.2",
    "protobuf>=4",
    "scikit-learn>=1.4",
    "sentencepiece>=0.2",
    "torch>=2.4,<2.11",  # 2.11+ wheels need CUDA 13 drivers; AIP images are CUDA 12.8,
    "transformers>=4.46,<5",
]

[tool.ruff]
line-length = 120
