[project]
name = "smlm-env"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=0.26",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "seqeval>=1.2",
    "torch>=2.4,<2.11",  # 2.11+ wheels need CUDA 13 drivers; AIP images are CUDA 12.8
    "transformers>=4.46,<5",
]

[tool.ruff]
line-length = 120
