[project]
name = "smlm-env"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [  # the authors' era (2022), as pinned by a verified reproduction of their results
    "allennlp==2.10.1",
    "beautifulsoup4==4.11.2",
    "convokit==2.5.3",
    "datasets==2.4.0",
    "flax",
    "fsspec==2022.8.2",
    "huggingface-hub==0.10.1",
    "lxml==4.9.4",
    "numpy==1.23.5",
    "pandas==1.5.3",
    "protobuf==3.20.3",
    "pyarrow==10.0.1",
    "scikit-learn==1.2.2",
    "scipy==1.10.1",
    "seqeval==1.2.2",
    "setuptools<82",  # convokit imports pkg_resources, removed in setuptools 82
    "tensorflow-cpu==2.12.1",
    "tokenizers==0.12.1",
    "torch==1.12.1",
    "torchvision==0.13.1",
    "transformers==4.20.1",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu113" }
torchvision = { index = "pytorch-cu113" }

[[tool.uv.index]]
name = "pytorch-cu113"
url = "https://download.pytorch.org/whl/cu113"
explicit = true

[tool.ruff]
line-length = 120
extend-exclude = ["src"]
